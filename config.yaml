# Parâmetros globais do squad.
# Tudo que é "número da metodologia" vive aqui — os agentes leem daqui.

marca:
  profissional: "Breno Xavier"
  titulo_linha_1: "Ed. Física / Nutrição"
  titulo_linha_2: "Pós em Biomecânica · Pós em Bases Fisiológicas"
  assinatura_rodape: "Consultoria online\nBRENO XAVIER\nEd. Física / Nutrição · Pós em Biomecânica · Pós em Bases Fisiológicas"

publico_alvo:
  genero: feminino
  faixa_etaria: [24, 45]
  objetivo_principal: "corpo definido"
  objetivo_secundario: "perda de gordura (meio, não fim)"

dieta:
  # Princípios NÃO negociáveis (lidos em core/dieta-principios.md)
  proximidade_alimentar_alvo_percent: [80, 100]  # quanto da dieta deve estar próxima do que a aluna já come
  frequencia_atualizacao_dias: 30                # troca mensal para senso de novidade + ajuste

  macros:
    # CONFIRMAR COM BRENO antes de usar em produção.
    # Valores placeholder baseados no que é comum em protocolos de definição feminina.
    proteina_g_por_kg: [1.8, 2.2]
    gordura_percent_vct: [20, 30]
    carbo_percent_vct: [40, 55]  # o que sobra após prot + gordura

  deficit_calorico:
    leve_percent_vct: [10, 15]
    moderado_percent_vct: [15, 20]
    # "agressivo" evitado por padrão — impacta adesão

  industrializados_aceitos:
    - "Bebida 0 / refrigerante zero"
    - "Energético 0"
    - "Leite em pó desnatado"
    - "Whey protein"
    - "Gelatina diet / zero"
    # (complete conforme o Breno alimentar)

avaliacao_postural:
  # Parâmetros compartilhados entre avaliação inicial e reavaliação
  graus_validos: [Normal, Leve, Alteração]
  evolucao_validas: [Melhorou, Manteve, Piorou]  # só usado em reavaliação
  views_foto:
    - Frontal
    - Posterior
    - Lateral D.
    - Lateral E.

  # AVALIAÇÃO INICIAL — regiões POR VISTA (padrão Maria Jennifer)
  inicial:
    template: templates/avaliacao-postural.md
    checklist: checklists/avaliacao.md
    regioes:
      anterior:
        - Cabeça / Pescoço
        - Ombros
        - Tronco / Abdome
        - Quadril / EIAS
        - Coxas
        - Joelhos
        - Tornozelos / Pés
      posterior:
        - Cabeça / Pescoço
        - Escápulas
        - Coluna Dorsal
        - Região Lombar
        - Glúteos / Quadril
        - Posterior de Coxa
        - Joelhos / Poplítea
        - Panturrilhas / Calcâneo
      lateral:
        - Cabeça / Cervical
        - Ombros / Tórax
        - Coluna Dorsal
        - Abdome
        - Pelve / Lombar
        - Quadril / Glúteos
        - Joelhos
        - Tornozelos / Pés

  # REAVALIAÇÃO COMPARATIVA — 9 regiões unificadas (padrão Gabriela Carline)
  reavaliacao:
    template: templates/reavaliacao-postural.md
    checklist: checklists/reavaliacao.md
    intervalo_sugerido_semanas: [8, 12]
    proxima_reavaliacao_dias: 35  # data sugerida no formulário de feedback = data atual + 35 dias
    regioes:
      - Cabeça / Cervical
      - Ombros
      - Coluna Torácica
      - Coluna Lombar / Pelve
      - Abdome / Tronco
      - Quadril / Glúteos
      - Joelhos
      - Tornozelos / Pés
      - Escápulas
    feedback_aluna:
      obrigatorio: true
      metodo: google_form  # Aluna responde online direto no link
      # Criado em 23/05/2026 via tools/criar-formulario-feedback-google.gs
      link_google_form: "https://docs.google.com/forms/d/e/1FAIpQLSfrQQityiWFDeb5sI9Zo3M5mPyHoJUhIRhJ8dwCjaYHsXsorg/viewform"   # link público → cola no WhatsApp da aluna
      link_edicao_formulario: "https://docs.google.com/forms/d/1YaXvVTrxQhU7PjG-Kqi-TU1eKi7FxzuLXyO1YABDUCY/edit"   # pra editar perguntas
      planilha_respostas: "https://docs.google.com/spreadsheets/d/1w5hXGrnLzPLBnQNAf2LLtveYLQGR0epwIEkULGEUFY4/edit"   # respostas de TODAS as alunas
      apps_script: tools/criar-formulario-feedback-google.gs
      # Fallback PDF (só usado se aluna não conseguir Google Forms)
      fallback_pdf:
        template: templates/feedback-aluna.html
        template_whatsapp: templates/feedback-aluna-whatsapp.md
      secoes:
        - "Identificação (nome + data)"
        - "Adesão (dieta / força / cardio — escala 0-10)"
        - "Dieta — fácil / chato / alimentos / fome / saída da linha"
        - "Treino de força — sessões, dor, execução, progressão"
        - "Cardio — sessões, modalidade, intensidade"
        - "Sensação corporal — corpo, mudanças visíveis, energia/sono/humor"
        - "Ciclo menstrual"
        - "Feedback aberto"
